name: CI

on: [push]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Run unit tests
        run: npm test

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Run ESLint
        run: npm run lint
